name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate icons
        run: |
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Set version 1.7
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 17/' android/app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "1.7"/' android/app/build.gradle
          grep -E 'version(Code|Name)' android/app/build.gradle

      - name: Inject native music scanner
        run: |
          python3 - <<'EOF'
          import pathlib, xml.etree.ElementTree as ET
          pkg = "com/artimoshka/cvetochek"
          src = pathlib.Path("native/MusicScannerPlugin.java").read_text()
          dst = pathlib.Path("android/app/src/main/java") / pkg / "MusicScannerPlugin.java"
          dst.write_text(src)
          mp = pathlib.Path("android/app/src/main/java") / pkg / "MainActivity.java"
          s = mp.read_text()
          if "MusicScannerPlugin" not in s:
              s = s.replace("import com.getcapacitor.BridgeActivity;",
                            "import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;")
              s = s.replace("public class MainActivity extends BridgeActivity {}",
                            "public class MainActivity extends BridgeActivity {\n"
                            "    @Override\n"
                            "    public void onCreate(Bundle savedInstanceState) {\n"
                            "        registerPlugin(MusicScannerPlugin.class);\n"
                            "        super.onCreate(savedInstanceState);\n"
                            "    }\n"
                            "}")
              mp.write_text(s)
          assert "registerPlugin(MusicScannerPlugin.class)" in mp.read_text(), "MainActivity patch failed"
          man = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          t = ET.parse(str(man))
          r = t.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          have = {e.get(ns + "name") for e in r.findall("uses-permission")}
          need = [("android.permission.READ_MEDIA_AUDIO", {}),
                  ("android.permission.READ_EXTERNAL_STORAGE", {"android:maxSdkVersion": "32"}),
                  ("android.permission.POST_NOTIFICATIONS", {})]
          pos = 0
          for perm, attrs in need:
              if perm not in have:
                  e = ET.Element("uses-permission")
                  e.set(ns + "name", perm)
                  for k, v in attrs.items():
                      pre, _, local = k.partition(":")
                      e.set("{%s}%s" % ("http://schemas.android.com/apk/res/android", local), v)
                  r.insert(pos, e)
                  pos += 1
          t.write(str(man), encoding="utf-8", xml_declaration=True)
          print("native scanner injected OK")
          EOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cvetochek-1.7
          path: android/app/build/outputs/apk/debug/app-debug.apk
