name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use persistent debug key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "persistent debug key installed"
          else
            echo "no DEBUG_KEYSTORE secret, ephemeral key"
          fi

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate icons
        run: |
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Set version 2.3
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 23/' android/app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "2.3"/' android/app/build.gradle
          grep -E 'version(Code|Name)' android/app/build.gradle

      - name: Inject native music scanner
        run: |
          python3 - <<'EOF'
          import pathlib, xml.etree.ElementTree as ET
          pkg = "com/artimoshka/cvetochek"
          for _name in ["MusicScannerPlugin.java", "PlayerService.java"]:
              _dst = pathlib.Path("android/app/src/main/java") / pkg / _name
              _dst.write_text((pathlib.Path("native") / _name).read_text())
          print("java copied")
          dd = pathlib.Path("android/app/src/main/res/drawable")
          dd.mkdir(parents=True, exist_ok=True)
          for _d in ["ic_fav_on.xml", "ic_fav_off.xml"]:
              (dd / _d).write_text((pathlib.Path("native") / _d).read_text())
          assert (dd / "ic_fav_on.xml").exists() and (dd / "ic_fav_off.xml").exists(), "drawables copy failed"
          ld = pathlib.Path("android/app/src/main/res/layout")
          ld.mkdir(parents=True, exist_ok=True)
          (ld / "notif_player.xml").write_text(pathlib.Path("native/notif_player.xml").read_text())
          assert (ld / "notif_player.xml").exists(), "layout copy failed"
          bgp = pathlib.Path("android/app/build.gradle")
          bg = bgp.read_text()
          if "androidx.media:media" not in bg:
              anchor = 'implementation "androidx.appcompat:appcompat:'
              assert anchor in bg, "gradle anchor missing"
              bg = bg.replace(anchor, 'implementation "androidx.media:media:1.7.0"\n    ' + anchor, 1)
              bgp.write_text(bg)
          bg2 = bgp.read_text()
          if "androidx.media3:media3-exoplayer" not in bg2:
              anchor2 = 'implementation "androidx.appcompat:appcompat:'
              assert anchor2 in bg2, "gradle anchor2 missing"
              bg2 = bg2.replace(anchor2, 'implementation "androidx.media3:media3-exoplayer:1.4.1"\n    ' + anchor2, 1)
              bgp.write_text(bg2)
          print("native assets ok")
          mp = pathlib.Path("android/app/src/main/java") / pkg / "MainActivity.java"
          s = mp.read_text()
          if "MusicScannerPlugin" not in s:
              s = s.replace("import com.getcapacitor.BridgeActivity;",
                            "import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;")
              s = s.replace("public class MainActivity extends BridgeActivity {}",
                            "public class MainActivity extends BridgeActivity {\n"
                            "    @Override\n"
                            "    public void onCreate(Bundle savedInstanceState) {\n"
                            "        registerPlugin(MusicScannerPlugin.class);\n"
                            "        super.onCreate(savedInstanceState);\n"
                            "    }\n"
                            "    @Override\n"
                            "    protected void onPostResume() {\n"
                            "        super.onPostResume();\n"
                            "        try {\n"
                            "            android.webkit.WebView wv = getBridge().getWebView();\n"
                            "            if (wv != null) { wv.onResume(); wv.resumeTimers(); }\n"
                            "        } catch (Exception ignored) {}\n"
                            "    }\n"
                            "}")
              mp.write_text(s)
          if "moveTaskToBack" not in mp.read_text():
              s2 = mp.read_text()
              s2 = s2.replace("protected void onPostResume()",
                              "public void onBackPressed() {\n        try { moveTaskToBack(true); } catch (Exception ignored) { super.onBackPressed(); }\n    }\n    @Override\n    protected void onPostResume()")
              mp.write_text(s2)
          assert "registerPlugin(MusicScannerPlugin.class)" in mp.read_text(), "MainActivity patch failed"
          man = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          t = ET.parse(str(man))
          r = t.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          have = {e.get(ns + "name") for e in r.findall("uses-permission")}
          need = [("android.permission.READ_MEDIA_AUDIO", {}),
                  ("android.permission.READ_EXTERNAL_STORAGE", {"android:maxSdkVersion": "32"}),
                  ("android.permission.POST_NOTIFICATIONS", {}),
                  ("android.permission.FOREGROUND_SERVICE", {}),
                  ("android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK", {}),
                  ("android.permission.WAKE_LOCK", {})]
          pos = 0
          for perm, attrs in need:
              if perm not in have:
                  e = ET.Element("uses-permission")
                  e.set(ns + "name", perm)
                  for k, v in attrs.items():
                      pre, _, local = k.partition(":")
                      e.set("{%s}%s" % ("http://schemas.android.com/apk/res/android", local), v)
                  r.insert(pos, e)
                  pos += 1
          app = r.find("application")
          if app is not None:
              haveSvc = [e.get(ns + "name") for e in app.findall("service")]
              if ".PlayerService" not in haveSvc and "com.artimoshka.cvetochek.PlayerService" not in haveSvc:
                  svc = ET.SubElement(app, "service")
                  svc.set(ns + "name", ".PlayerService")
                  svc.set(ns + "exported", "false")
                  svc.set(ns + "foregroundServiceType", "mediaPlayback")
                  svc.set(ns + "stopWithTask", "false")
              for _svc in app.findall("service"):
                  _nm = _svc.get(ns + "name") or ""
                  if "PlayerService" in _nm:
                      _svc.set(ns + "stopWithTask", "false")
                      if not _svc.get(ns + "foregroundServiceType"):
                          _svc.set(ns + "foregroundServiceType", "mediaPlayback")
              haveRecv = [e.get(ns + "name") for e in app.findall("receiver")]
              if "androidx.media.session.MediaButtonReceiver" not in haveRecv:
                  rcv = ET.SubElement(app, "receiver")
                  rcv.set(ns + "name", "androidx.media.session.MediaButtonReceiver")
                  rcv.set(ns + "exported", "false")
                  flt = ET.SubElement(rcv, "intent-filter")
                  act = ET.SubElement(flt, "action")
                  act.set(ns + "name", "android.intent.action.MEDIA_BUTTON")
          t.write(str(man), encoding="utf-8", xml_declaration=True)
          print("native scanner injected OK")
          EOF

      - name: Verify Android 16 container
        run: |
          grep -E 'compileSdk|targetSdk|minSdk' android/app/build.gradle || true
          echo "--- native libs in template (16KB check) ---"
          find ~/.gradle /root/.gradle -name "*.so" 2>/dev/null | head -5 || true
          echo "verify done"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check APK (targetSdk + native alignment)
        run: |
          ls -la android/app/build/outputs/apk/debug/
          AAB=$(ls android/app/build/outputs/apk/debug/app-debug.apk | head -1)
          echo "APK: $AAB"
          unzip -l "$AAB" | grep -E '\.so$' || echo "no .so files (16KB rule not applicable)"
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$AAB" 2>/dev/null | head -8 || echo "(apksigner check skipped)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cvetochek-2.3
          path: android/app/build/outputs/apk/debug/app-debug.apk
